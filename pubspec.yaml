name: vibelink
description: "VibeLink - Fight loneliness through real-world social challenges"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  gap: ^3.0.1
  cached_network_image: ^3.4.1

  # Location & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0

  # Networking
  socket_io_client: ^3.0.2
  dio: ^5.7.0

  # Utilities
  intl: ^0.19.0
  fluttertoast: ^9.1.0
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App launcher icon — run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
