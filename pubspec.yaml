name: vibelink
description: "VibeLink - Fight loneliness through real-world social challenges"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.6.2

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  gap: ^3.0.1
  cached_network_image: ^3.4.1

  # Location & Maps
  geolocator: ^12.0.0
  google_maps_flutter: ^2.9.0

  # Networking
  socket_io_client: ^3.0.2

  # Utilities
  intl: ^0.19.0
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
